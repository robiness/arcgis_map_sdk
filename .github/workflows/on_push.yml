name: CI

on: [push]

# Flutter is pinned to the version the NOA app builds with: unpinned, every
# release changes the formatter and the lints and fails code nobody touched.

jobs:
  analyze:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.4'
      - run: ./am deps
      - run: ./am analyze --fatal-warnings --fatal-infos

  format:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.4'
      - run: ./am deps
      - run: ./am format --verify

  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.4'
      - run: ./am deps
      - run: ./am test
