name: arcgis_map_sdk_web
description: Esri ArcGIS Flutter web implementation.
version: 0.8.0
repository: https://github.com/fluttercommunity/arcgis_map_sdk
maintainer: Matthaios Saitakis (@MatthaiosSait), Pascal Welsch (@passsy), Max Peters (@maxpeters)

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  arcgis_map_sdk_platform_interface: ^1.0.1
  async: ^2.9.0

  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.8.0
  mockito: ^5.0.17

flutter:
  plugin:
    implements: arcgis_map_sdk
    platforms:
      web:
        pluginClass: ArcgisMapWeb
        fileName: src/arcgis_map_sdk_web.dart

  assets:

    - assets/css_overrides/

  # assets end
